<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Alerto">
  <!--
    The tab mark.

    Drawn rather than set in type, because a favicon cannot load the brand face
    and a fallback A would be a different letterform on every machine. These are
    three strokes on the same geometry Manrope 800 uses: a steep apex, a low
    crossbar, round joins.

    Geometry over glyph is also what makes it survive 16px. Anything with the
    detail of a lighthouse — tower, railing, beams — resolves to a smudge at tab
    size, which is the size that actually matters.

    Lime ground with ink on top is the brand's primary-action pairing, measured
    at 13.05:1. It stays legible against both a light and a dark browser chrome,
    so the mark needs no scheme-aware variant.
  -->
  <rect width="32" height="32" rx="8" fill="#9fe870" />
  <path
    d="M8.5 24 L16 8.5 L23.5 24"
    fill="none"
    stroke="#0e0f0c"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M12 18.5 H20"
    fill="none"
    stroke="#0e0f0c"
    stroke-width="4"
    stroke-linecap="round"
  />
</svg>
